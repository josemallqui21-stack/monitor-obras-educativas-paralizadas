name: Descargar de los portales y reprocesar (manual, experimental)

# Solo con el boton "Run workflow". Vuelve a consultar ESCALE, ENLA, la Contraloria y el MEF (Chrome sin ventana) y despues corre el pipeline.
# INFOBRAS NO se incluye por defecto: es una foto (27-oct y 11-nov-2026) y leerlo de nuevo cambia los numeros; ademas debe leerlo una sola persona a la vez.
# Es experimental: algunos portales pueden bloquear o responder distinto a los servidores de GitHub. Las descargas nuevas quedan como archivo
# adjunto de la corrida (artifact) para subirlas al Release «datos-crudos» si se quiere conservarlas.
on:
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes a descargar, separadas por coma (escale,enla,contraloria,mef)"
        default: "escale,enla,contraloria,mef"
        required: true

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar las librerias
        run: pip install -r requirements.txt

      - name: Bajar los datos crudos que ya tenemos (para no repetir descargas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download datos-crudos --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/crudos"
          python -c "import glob, os, zipfile; [zipfile.ZipFile(z).extractall('.') for z in sorted(glob.glob(os.environ['RUNNER_TEMP'] + '/crudos/*.zip'))]"

      - name: Descargar y correr el pipeline
        run: python src/pipeline_completo.py --fuentes "${{ inputs.fuentes }}" --headless

      - name: Guardar resultados y descargas nuevas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descarga-y-resultados
          path: |
            data/raw/
            data/final/
            docs/registro_fuentes.csv
            docs/log_descargas.txt
            docs/validacion_final.csv
            docs/auditoria_calidad.csv
          retention-days: 14
